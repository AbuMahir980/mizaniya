# WHAT: The checks every pull request has to pass before it can reach `main`.
# WHY:  **The verify job runs `npm run verify` and nothing else.** Re-listing
#       lint, typecheck and tests as separate steps here would create a second
#       opinion about what "passing" means, and the two would drift — so a green
#       run here and a green run on a laptop are the identical claim.
# INTERVIEW: I made CI call the same one command developers run, so there is no
#       second definition of "green" to fall out of step with the first.

name: PR Checks

on:
  pull_request:
    branches: [main]
  # `main` too, so the badge in the README reports the branch people land on
  # rather than the last pull request someone happened to open.
  push:
    branches: [main]

# A second push supersedes the run still going for the first.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # `.nvmrc` is the single source of truth. Naming a version here as
          # well is how CI ends up testing a runtime nobody develops on.
          node-version-file: .nvmrc
          cache: npm

      # `ci`, never `install`: it installs the committed lockfile exactly and
      # fails if `package.json` and the lockfile disagree.
      - run: npm ci

      - run: npm run verify

  repo-rules:
    name: repo rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the guard reads the commit messages on the branch, and
          # a squash merge makes those subjects permanent on `main`.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # No `npm ci` — the guard uses node builtins and git, so this job is a few
      # seconds rather than a full install.
      - name: No employer, client or third-party project names (repo rule 3)
        run: node scripts/check-repo-rules.mjs
        env:
          # The terms cannot live in the repository — that is the rule. They
          # come from a secret, and the guard prints positions, never matches.
          MIZANIYA_FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}

  secrets:
    name: secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks reads history: a key deleted in a later commit is still
          # published, and scanning only the tip would miss exactly that case.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
