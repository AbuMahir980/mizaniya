# Generated by peer-ai render from peer-ai.config.json: the gate, peer-ai check (RFC 0009).
# Change the config, not this file. Render writes it again while it's as render left it, and leaves
# it alone once someone changes it by hand. Make the job a required check: its name never changes.
# peer-ai sha256: 60760c26667b8d3f
name: Peer AI
on:
  pull_request:
permissions:
  contents: read
jobs:
  peer-ai-check:
    name: peer-ai check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npx -y peer-ai@1.0.0-next.15 check
