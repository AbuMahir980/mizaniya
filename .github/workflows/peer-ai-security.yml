# Generated by peer-ai render from peer-ai.config.json: the checks of the github-actions stack profile.
# Change the config, not this file. Render writes it again while it's as render left it, and leaves
# it alone once someone changes it by hand. A job whose check has continue-on-error only reports for now,
# in the report stage or for a deferred rule (RFC 0011): it stays green, and warns about what it finds.
# Make a job a required check once it enforces: their names never change.
# peer-ai sha256: ccf0d65776a75e80
name: Peer AI security checks
on:
  pull_request:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
permissions: {}
jobs:
  secrets:
    name: peer-ai / secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Skip a push that changes only Peer AI's records
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          code=true
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" --jq '.files[].filename') &&
              ! grep -qv '^\.peer-ai/' <<< "$files" && code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Install Gitleaks 8.30.1
        if: steps.changes.outputs.code == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/peer-ai-tools"
          echo "$RUNNER_TEMP/peer-ai-tools" >> "$GITHUB_PATH"
          curl -sSfL -o "$RUNNER_TEMP/peer-ai-tools"/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/peer-ai-tools/gitleaks.tar.gz" | sha256sum --check --quiet
          tar -xzf "$RUNNER_TEMP/peer-ai-tools"/gitleaks.tar.gz -C "$RUNNER_TEMP/peer-ai-tools" gitleaks
      - name: Check GHA-01
        if: steps.changes.outputs.code == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            gitleaks git --no-banner --redact --verbose --exit-code 1 --log-opts="$BASE_SHA..$HEAD_SHA" .
          else
            gitleaks git --no-banner --redact --verbose --exit-code 1 .
          fi
  dependencies:
    name: peer-ai / dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Skip a push that changes only Peer AI's records
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          code=true
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" --jq '.files[].filename') &&
              ! grep -qv '^\.peer-ai/' <<< "$files" && code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Install OSV-Scanner 2.6.0
        if: steps.changes.outputs.code == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/peer-ai-tools"
          echo "$RUNNER_TEMP/peer-ai-tools" >> "$GITHUB_PATH"
          curl -sSfL -o "$RUNNER_TEMP/peer-ai-tools"/osv-scanner https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64
          echo "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108  $RUNNER_TEMP/peer-ai-tools/osv-scanner" | sha256sum --check --quiet
          chmod +x "$RUNNER_TEMP/peer-ai-tools"/osv-scanner
      - name: Check GHA-02
        if: steps.changes.outputs.code == 'true'
        id: check
        continue-on-error: true
        run: |
          status=0
          osv-scanner scan source --recursive . || status=$?
          if [ "$status" -eq 128 ]; then
            echo "::warning::OSV-Scanner found no lockfile or manifest it can read, so no dependency was checked."
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
      - name: Report what the checks found
        if: steps.check.outcome == 'failure'
        run: |
          echo "::warning title=peer-ai / dependencies::GHA-02 found problems. Reporting only for now (standards.enforcement or standards.deferred), so this doesn't fail the build: the check's log lists them."
          echo "### peer-ai / dependencies: GHA-02 found problems. Reporting only for now (standards.enforcement or standards.deferred), so this doesn't fail the build: the check's log lists them." >> "$GITHUB_STEP_SUMMARY"
  workflows:
    name: peer-ai / workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Skip a push that changes only Peer AI's records
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          code=true
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" --jq '.files[].filename') &&
              ! grep -qv '^\.peer-ai/' <<< "$files" && code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Install zizmor 1.30.1
        if: steps.changes.outputs.code == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/peer-ai-tools"
          echo "$RUNNER_TEMP/peer-ai-tools" >> "$GITHUB_PATH"
          docker pull ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101
      - name: Check GHA-03, GHA-04
        if: steps.changes.outputs.code == 'true'
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101 --offline .
  code:
    name: peer-ai / code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Skip a push that changes only Peer AI's records
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          code=true
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" --jq '.files[].filename') &&
              ! grep -qv '^\.peer-ai/' <<< "$files" && code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Install Semgrep 1.178.0
        if: steps.changes.outputs.code == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/peer-ai-tools"
          echo "$RUNNER_TEMP/peer-ai-tools" >> "$GITHUB_PATH"
          git init -q "$RUNNER_TEMP/peer-ai-tools"/semgrep-rules
          git -C "$RUNNER_TEMP/peer-ai-tools"/semgrep-rules fetch -q --depth 1 https://github.com/semgrep/semgrep-rules 07135b5255b20ad6c29967215422b1ecc1f03988
          git -C "$RUNNER_TEMP/peer-ai-tools"/semgrep-rules checkout -q FETCH_HEAD
          docker pull semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
      - name: Check GHA-05
        if: steps.changes.outputs.code == 'true'
        run: |
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/peer-ai-tools"/semgrep-rules:/rules:ro -w /src semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b semgrep scan --config /rules/python/lang/security --config /rules/javascript/lang/security --config /rules/typescript/lang/security --config /rules/go/lang/security --config /rules/java/lang/security --config /rules/ruby/lang/security --config /rules/php/lang/security --config /rules/csharp/lang/security --error --metrics off --quiet .
